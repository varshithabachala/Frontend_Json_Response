<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Requests</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 40px;
  }
  a.back { color: #8b949e; font-size: 13px; text-decoration: none; }
  a.back:hover { color: #e6edf3; }
  h1 { font-size: 22px; font-weight: 600; margin: 12px 0 4px; }
  p.sub { color: #8b949e; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; }
  th {
    text-align: left; background: #21262d; color: #8b949e; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px;
    border-bottom: 1px solid #30363d;
  }
  td { padding: 12px 16px; border-bottom: 1px solid #21262d; font-size: 14px; vertical-align: top; }
  td.status-success { color: #35d4ac; }
  td.status-failed { color: #ff6b6b; }
  tr:hover td { background: #1c2129; }
  #loading { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <a class="back" href="forti_products.html">&larr; Back to Forti Products</a>
  <h1 id="pageTitle">Loading...</h1>
  <p class="sub" id="pageSub"></p>
  <p id="loading">Loading live data from the database...</p>
  <table id="reqTable" style="display:none;">
    <tr><th>Requester</th><th>Timestamp</th><th>Request</th><th>Status</th></tr>
    <tbody id="tableBody"></tbody>
  </table>

<script>
  const BACKEND_URL = "http://10.37.34.7:8001";

  const params = new URLSearchParams(window.location.search);
  const product = params.get('product') || '';

  document.getElementById('pageTitle').textContent = product;

  async function loadProductRequests() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/requests`);
      const data = await res.json();

      const matches = data.filter(r =>
        (r.request_text || '').toLowerCase().includes(product.toLowerCase())
      );

      document.getElementById('loading').style.display = 'none';
      document.getElementById('reqTable').style.display = 'table';
      document.getElementById('pageSub').textContent =
        `${matches.length} request(s) involving ${product}`;

      document.getElementById('tableBody').innerHTML = matches.map(r => `
        <tr>
          <td>${escapeHtml(r.requester_name)}</td>
          <td>${escapeHtml(r.requested_at)}</td>
          <td>${escapeHtml(r.request_text)}</td>
          <td class="status-${r.status}">${escapeHtml(r.status)}</td>
        </tr>
      `).join('');

    } catch (error) {
      document.getElementById('loading').textContent =
        'Could not load data. Make sure the backend server is running.';
      console.error(error);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  loadProductRequests();
</script>
</body>
</html>
