<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forti Products - Requesters</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 40px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  p.sub { color: #8b949e; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; }
  th {
    text-align: left; background: #21262d; color: #8b949e; font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 16px;
    border-bottom: 1px solid #30363d;
  }
  td { padding: 12px 16px; border-bottom: 1px solid #21262d; font-size: 14px; vertical-align: top; }
  td.product { font-weight: 600; color: #58a6ff; white-space: nowrap; width: 220px; }
  td.names { color: #c9d1d9; line-height: 1.6; }
  tr:hover td { background: #1c2129; }
  #loading { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <h1>Forti Products &mdash; Requesters</h1>
  <p class="sub">Each Forti product and everyone who has requested a playbook involving it.</p>
  <p id="loading">Loading live data from the database...</p>
  <table id="productTable" style="display:none;">
    <tr><th>Product</th><th>Requesters</th></tr>
    <tbody id="tableBody"></tbody>
  </table>

<script>

  const BACKEND_URL = "http://10.37.34.7:8001";

  async function loadProducts() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/forti-products`);
      const data = await res.json();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('productTable').style.display = 'table';

      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = data.products.map(p => `
        <tr>
          <td class="product"><a href="product_requests.html?product=${encodeURIComponent(p.product)}" style="color:#58a6ff; text-decoration:none;">${p.product}</a></td>
          <td class="names">${p.requesters.join(', ')}</td>
        </tr>
      `).join('');

    } catch (error) {
      document.getElementById('loading').textContent =
        'Could not load data. Make sure the backend server is running.';
      console.error(error);
    }
  }

  loadProducts();
</script>
</body>
</html>
