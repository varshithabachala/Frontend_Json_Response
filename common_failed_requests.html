<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Common Failed Playbook Requests</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 40px;
    max-width: 900px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
  h2 { font-size: 16px; font-weight: 600; margin-top: 32px; margin-bottom: 6px; color: #58a6ff; }
  p { color: #c9d1d9; line-height: 1.6; font-size: 14px; }
  table { width: 100%; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  th { text-align: left; background: #21262d; color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; border-bottom: 1px solid #30363d; }
  td { padding: 10px 14px; border-bottom: 1px solid #21262d; font-size: 14px; color: #c9d1d9; }
  td.count { color: #58a6ff; font-weight: 600; }
  #loading { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <h1>Common Failed Playbook Requests</h1>
  <p id="loading">Loading live data from the database...</p>
  <div id="content" style="display:none;">
    <p id="intro"></p>
    <div id="patterns"></div>
  </div>

<script>

  const BACKEND_URL = "http://10.37.34.7:8001";

  async function loadData() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/common-failures`);
      const data = await res.json();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      document.getElementById('intro').textContent =
        `Out of ${data.total} total playbook requests, ${data.failed} failed, coming from ` +
        `${data.people_affected} different people. ${data.shared_patterns} specific request(s) ` +
        `failed repeatedly, each time by a different person, which points to request types the ` +
        `system consistently cannot handle, rather than one-time user mistakes.`;

      const patternsDiv = document.getElementById('patterns');
      patternsDiv.innerHTML = '';

      data.patterns.forEach((pattern, index) => {
        const peopleCount = pattern.people.length;
        const heading = document.createElement('h2');
        heading.textContent = `${index + 1}. ${pattern.request_text.slice(0, 80)}${pattern.request_text.length > 80 ? '...' : ''} — failed ${pattern.total_failures} times, ${peopleCount} people`;
        patternsDiv.appendChild(heading);

        const table = document.createElement('table');
        table.innerHTML = `
          <tr><th>Requested By</th><th>Times Failed</th></tr>
          ${pattern.people
            .sort((a, b) => b.count - a.count)
            .map(p => `<tr><td>${p.name}</td><td class="count">${p.count}</td></tr>`)
            .join('')}
        `;
        patternsDiv.appendChild(table);
      });

    } catch (error) {
      document.getElementById('loading').textContent =
        'Could not load data. Make sure the backend server is running.';
      console.error(error);
    }
  }

  loadData();
</script>
</body>
</html>
