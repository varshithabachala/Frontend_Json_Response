<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Common Failed Playbook Requests</title>
<style>
  body {
    background: #0d1117;
    color: #e6edf3;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    margin: 0;
    padding: 40px;
    max-width: 900px;
  }
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 16px; }
  p { color: #c9d1d9; line-height: 1.6; font-size: 14px; }

  .pattern-title { font-size: 16px; font-weight: 600; margin-top: 28px; margin-bottom: 2px; color: #58a6ff; }
  .pattern-sub { color: #8b949e; font-size: 13px; margin: 0 0 10px; }

  table { width: 100%; table-layout: fixed; border-collapse: collapse; background: #161b22; border-radius: 8px; overflow: hidden; margin-bottom: 8px; }
  th { text-align: left; background: #21262d; color: #8b949e; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; border-bottom: 1px solid #30363d; }
  td { padding: 10px 14px; border-bottom: 1px solid #21262d; font-size: 14px; color: #c9d1d9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.count { color: #58a6ff; font-weight: 600; }
  th:first-child, td:first-child { width: 78%; }
  th:last-child, td:last-child { width: 22%; text-align: left; }
  #loading { color: #8b949e; font-size: 14px; }
</style>
</head>
<body>
  <h1>Common Failed Playbook Requests</h1>
  <p id="loading">Loading live data from the database...</p>

  <div id="content" style="display:none;">
    <p id="intro"></p>
    <div id="patterns"></div>
  </div>

<script>
  const BACKEND_URL = "http://10.37.34.7:8001";

  async function loadData() {
    try {
      const res = await fetch(`${BACKEND_URL}/api/common-failures`);
      const data = await res.json();

      document.getElementById('loading').style.display = 'none';
      document.getElementById('content').style.display = 'block';

      document.getElementById('intro').textContent =
        `Out of ${data.total} total playbook requests, ${data.failed} failed, coming from ` +
        `${data.people_affected} different people. ${data.shared_patterns} specific request(s) ` +
        `failed repeatedly, each time by a different person.`;

      const patternsDiv = document.getElementById('patterns');
      patternsDiv.innerHTML = '';

      data.patterns.forEach((pattern, index) => {
        const peopleCount = pattern.people.length;

        const title = document.createElement('div');
        title.className = 'pattern-title';
        title.textContent = `${index + 1}. ${pattern.request_text}`;
        patternsDiv.appendChild(title);

        const sub = document.createElement('div');
        sub.className = 'pattern-sub';
        sub.textContent = `Failed ${pattern.total_failures} times, across ${peopleCount} different people.`;
        patternsDiv.appendChild(sub);

        const table = document.createElement('table');
        table.innerHTML = `
          <tr><th>Requested By</th><th>Times Failed</th></tr>
          ${pattern.people
            .sort((a, b) => b.count - a.count)
            .map(p => `<tr><td>${escapeHtml(p.name)}</td><td class="count">${p.count}</td></tr>`)
            .join('')}
        `;
        patternsDiv.appendChild(table);
      });

    } catch (error) {
      document.getElementById('loading').textContent =
        'Could not load data. Make sure the backend server is running.';
      console.error(error);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  loadData();
</script>
</body>
</html>
